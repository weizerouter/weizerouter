<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="50%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#12091f"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beamReverse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }
      .pulsing-indicator {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 104px 50px;
      }
      .floating-logo {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .laser-beam-1 {
        stroke-dasharray: 120 180;
        animation: beamMove 8s linear infinite;
      }
      .laser-beam-2 {
        stroke-dasharray: 80 220;
        animation: beamReverse 10s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="18" fill="url(#cyberGrid)"/>
  <rect width="1198" height="418" x="1" y="1" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Animated Laser Energy Waves -->
  <path class="laser-beam-1" d="M -50 360 C 250 280 420 390 700 320 C 950 260 1080 340 1250 240" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.7" filter="url(#softGlow)"/>
  <path class="laser-beam-2" d="M -50 390 C 200 320 480 380 750 340 C 980 300 1100 280 1250 270" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.5"/>

  <!-- Live Status Badge Top-Left -->
  <g transform="translate(48, 36)">
    <rect width="210" height="30" rx="15" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <circle class="pulsing-indicator" cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#softGlow)"/>
    <text x="30" y="19.5" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE SYSTEM OPERATIONAL</text>
  </g>

  <!-- Tagline Badge Top-Right -->
  <g transform="translate(930, 36)">
    <rect width="222" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.8" stroke="#3730a3" stroke-width="1"/>
    <text x="111" y="19.5" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OPENAI COMPATIBLE v1</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(48, 105)">
    <!-- Brand Title -->
    <text x="0" y="55" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5" filter="url(#softGlow)">WeizeRouter</text>
    <text x="355" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">ENTERPRISE CORE</text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.2">High-Performance Multi-Engine AI API Gateway &amp; Developer Infrastructure</text>

    <!-- Description -->
    <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Unified routing for Frontier LLMs • 1M Context Window • Permanent Wallets • Sub-second TTFT
    </text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 165)">
      <!-- Pill 1: Permanent Token -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="21" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ Rp65 / 1M Token</text>
        <text x="120" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Permanent</text>
      </g>

      <!-- Pill 2: 1M Context -->
      <g transform="translate(180, 0)">
        <rect width="165" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">♾️ 1M Context</text>
        <text x="98" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Muse Spark</text>
      </g>

      <!-- Pill 3: Dual Engine -->
      <g transform="translate(355, 0)">
        <rect width="185" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="21" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🚀 Dual 9Router + Go</text>
        <text x="145" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Engine</text>
      </g>

      <!-- Pill 4: Pakasir QRIS -->
      <g transform="translate(550, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="21" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">💳 Instant QRIS</text>
        <text x="102" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Automated</text>
      </g>
    </g>

    <!-- Quick Terminal Snippet Box -->
    <g transform="translate(0, 222)">
      <rect width="660" height="38" rx="8" fill="#090d16" stroke="#1e293b"/>
      <text x="16" y="24" fill="#64748b" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="12">$</text>
      <text x="32" y="24" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="12">curl</text>
      <text x="68" y="24" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="12">https://weizerouter.web.id/v1/chat/completions -d</text>
      <text x="440" y="24" fill="#f59e0b" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="12">'{"model":"wz/muse-spark-1.3-contributor"}'</text>
    </g>
  </g>

  <!-- Right Graphic Column (Cyber Emblem) -->
  <g class="floating-logo" transform="translate(970, 220)">
    <!-- Ambient Neon Circles -->
    <circle cx="0" cy="0" r="110" fill="#38bdf8" fill-opacity="0.04" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="85" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="95" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="60" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="2"/>

    <!-- Geometric "W" Logo -->
    <path d="M -26 -20 L -12 24 L 0 4 L 12 24 L 26 -20 H 14 L 6 8 L 0 -8 L -6 8 L -14 -20 Z" fill="url(#accentGrad)" filter="url(#softGlow)"/>

    <!-- Orbital Satellite Nodes -->
    <circle cx="-60" cy="-60" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="70" cy="-40" r="3" fill="#f59e0b" filter="url(#softGlow)"/>
    <circle cx="65" cy="55" r="4.5" fill="#a855f7" filter="url(#softGlow)"/>
    <circle cx="-50" cy="65" r="3.5" fill="#10b981" filter="url(#softGlow)"/>
  </g>
</svg>
